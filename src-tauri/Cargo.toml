[package]
name = "dcs-accounting"
version = "0.1.0"
description = "個人事業主向けの確定申告用会計ソフト"
edition = "2021"
rust-version = "1.85"
license = "ISC"
publish = false

[lib]
# Windows でバイナリ名とライブラリ名が衝突しないよう、別名にする
name = "dcs_accounting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
# 0.42.0 は公開から 7 日たつ前（2026-11-11 公開）に入れた。同梱の SQLite の脆弱性
# （RUSTSEC-2026-0502、sqlcipher-src 420.0.0 で修正）を直すため、セキュリティ修正として例外にした。
# 一緒に上がる sqlite-wasm-rs 0.6.3（2026-11-10 公開）は WebAssembly 向けだけで、このアプリのビルドには入らない
rusqlite = { version = "=0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }

# 自動アップデートはデスクトップだけで使う
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
# 配布サイズとメモリ使用量を抑える
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
