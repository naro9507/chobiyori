# pnpm の設定（サプライチェーン攻撃への備え）
# パッケージは 1 つだけで、ワークスペースとしては使っていない。

# 公開されてから 7 日（10080 分）たっていない版は入れない。
# 乗っ取られたアカウントから出た悪意ある版は、たいてい数日以内に見つかって取り下げられる。
minimumReleaseAge: 10080

# 以前の版より信頼の証拠（npm の来歴証明など）が弱い版には上げない
trustPolicy: no-downgrade

# 依存の依存が、レジストリ以外（Git リポジトリや URL）から取ってくることを禁じる
blockExoticSubdeps: true

# インストール時のスクリプト（postinstall など）は、ここに書いたものだけ実行する。
# 書いていないパッケージがスクリプトを持っていたら、インストールを失敗させる。
strictDepBuilds: true
onlyBuiltDependencies: []
