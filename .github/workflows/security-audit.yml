# 既知の脆弱性は通常の CI と分け、定期監査の失敗を Issue で追跡する。
name: Security audit

on:
  schedule:
    - cron: "17 0 * * *" # 毎日 9:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # lockfile を監査するため、依存のインストールやビルドは不要。
      - run: pnpm audit --audit-level high

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  notify:
    needs: [npm, rust]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: 未解決の監査 Issue を更新、なければ作成する
        run: node scripts/report-security-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ASSIGNEE: naro9507
          AUDIT_NPM_RESULT: ${{ needs.npm.result }}
          AUDIT_RUST_RESULT: ${{ needs.rust.result }}
