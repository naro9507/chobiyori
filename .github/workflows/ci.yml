# プッシュとプルリクエストのたびに、画面と Rust の検査を行う
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tauri のビルドに必要な Linux のライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # 帳簿の PDF のテストで使う日本語のフォント
          sudo apt-get install -y fonts-ipafont-gothic

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 依存の既知の脆弱性を確かめる（npm）
        run: pnpm audit --audit-level high

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: 画面のビルド（Rust のビルドで必要）
        run: pnpm build:web

      - name: 画面の検査
        run: |
          pnpm check
          pnpm typecheck
          pnpm test

      - name: 依存の既知の脆弱性を確かめる（Rust）
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Rust の検査
        run: |
          pnpm format:rust
          pnpm lint:rust
          pnpm test:rust
