# main へのプッシュとプルリクエストで、画面と Rust の検査を行う
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  # main の各コミットは、次の push が来てもタグ公開用の検査を完走させる。
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tauri のビルドに必要な Linux のライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # 帳簿の PDF のテストで使う日本語のフォント
          sudo apt-get install -y fonts-ipafont-gothic

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: アップデート用の公開鍵と検証スクリプトを確かめる
        run: |
          node --test scripts/check-signing-key.test.mjs
          node --test scripts/signing-preflight.test.mjs
          node scripts/check-signing-key.mjs

      - name: 監査 Issue の通知処理を確かめる
        run: node --test scripts/report-security-audit.test.mjs

      - name: 変更履歴のまとめ方を確かめる
        run: node --test scripts/changeset-changelog.test.mjs

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: 画面のビルド（Rust のビルドで必要）
        run: pnpm build:web

      - name: 画面の検査
        run: |
          pnpm check
          pnpm typecheck
          pnpm test

      - name: Rust の検査
        run: |
          pnpm format:rust
          pnpm lint:rust
          pnpm test:rust
