# Issue で `@codex` と書くと、Codex が Issue の内容を実装してプルリクエストを作る。
# 動かせるのは naro9507 だけ。ほかの人のメンションでは何もしない。
#
# 準備:
#   - リポジトリの Secrets に OPENAI_API_KEY を登録する
#   - Settings → Actions → General → Workflow permissions で
#     「Allow GitHub Actions to create and approve pull requests」をオンにする
#
# 安全のため、ジョブを 3 つに分けている。
#   ack:     受け付けたしるしに 👀 を付ける（Issue への書き込みだけ）
#   codex:   Codex が作業する（リポジトリの読み取りだけ。書き込みの権限は持たせない）
#   publish: Codex の変更をブランチに載せてプルリクエストを作り、Issue に結果を返す
name: Codex

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ack:
    # Issue 本文（新規作成時）かコメントに @codex があり、書いたのが naro9507 のときだけ動く。
    # プルリクエストへのコメントは対象外。
    if: >-
      github.event.sender.login == 'naro9507' &&
      !github.event.issue.pull_request &&
      contains(github.event_name == 'issues' && github.event.issue.body || github.event.comment.body, '@codex')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 受け付けたしるしに 👀 を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes
          else
            gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/reactions" -f content=eyes
          fi

  codex:
    needs: ack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Codex の作業中はネットワークに出られないので、依存は先に入れておく。
      - name: Tauri のビルドに必要な Linux のライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev fonts-ipafont-gothic

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Rust の crate を先に取ってくる
        run: cargo fetch --locked
        working-directory: src-tauri

      # sudo を外してから Codex を動かすため、Codex はこのジョブで最後に sudo を使う処理にする。
      - name: Codex に作業させる
        id: run_codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.168.0
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            あなたは GitHub リポジトリ ${{ github.repository }} の開発者です。
            次の Issue に書かれた依頼をこのリポジトリで実装してください。

            - まず AGENTS.md と docs/ の関連する資料を読み、その方針に従うこと。
            - 変更はファイルの編集だけにし、git commit や git push はしないこと（後の処理で行う）。
            - ネットワークには出られない。依存（pnpm と cargo）は取得済み。
            - 可能な範囲で `pnpm check`、`pnpm typecheck`、`pnpm test`、
              Rust を変えた場合は `pnpm build:web` のあと `pnpm format:rust`、`pnpm lint:rust`、`pnpm test:rust` で確かめること。
            - 依頼があいまいで実装できない場合は、何もしないで確認したいことを書くこと。
            - 最後に、変えた内容と確かめた結果を日本語で簡潔にまとめること。
              これはそのままプルリクエストの本文と Issue のコメントになる。

            ## Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            ## 依頼のコメント

            ${{ github.event.comment.body || '（Issue 本文を参照）' }}

      - name: Codex の変更をパッチにする
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/codex.patch"
          git diff --cached --stat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-patch
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [ack, codex]
    if: ${{ always() && needs.ack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.codex.result == 'success' }}
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.codex.result == 'success' }}
        with:
          name: codex-patch
          path: ${{ runner.temp }}

      - name: ブランチとプルリクエストを作り、Issue に結果を返す
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CODEX_RESULT: ${{ needs.codex.result }}
          FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: codex/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          comment() {
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file -
          }

          if [ "$CODEX_RESULT" != "success" ]; then
            printf 'Codex の実行に失敗しました。\n\n実行ログ: %s\n' "$RUN_URL" | comment
            exit 1
          fi

          patch="$RUNNER_TEMP/codex.patch"
          if [ ! -s "$patch" ]; then
            printf '%s\n\n---\n変更はありませんでした。実行ログ: %s\n' "$FINAL_MESSAGE" "$RUN_URL" | comment
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git apply --index "$patch"
          title=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title --jq .title)
          git commit -m "$title" -m "Codex による実装（#$ISSUE_NUMBER）"
          # チェックアウトに認証情報を残さないため、プッシュのときだけトークンを渡す
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"

          pr_url=$(printf '%s\n\nCloses #%s\n\n---\nCodex が作成しました。実行ログ: %s\n' \
              "$FINAL_MESSAGE" "$ISSUE_NUMBER" "$RUN_URL" |
            gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
              --title "$title" --body-file - --draft)

          printf 'プルリクエストを作りました: %s\n\n%s\n' "$pr_url" "$FINAL_MESSAGE" | comment
