# Windows・macOS・Linux 用のインストーラを、それぞれの OS の上で作る。
#
# - 手動で実行（Actions タブの「Run workflow」）: インストーラを成果物（Artifacts）として保存する
# - v から始まるタグ（例: v0.1.0）をプッシュ: GitHub の Release を下書きで作り、インストーラを添付する
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # 一時的: このブランチで Windows・macOS のビルドを確かめる。確認後に消す
    branches: ["ccr-86947de0-ilqj33"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: linux
            os: ubuntu-24.04
            args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tauri のビルドに必要な Linux のライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS では Apple Silicon 用と Intel 用の両方を作る
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: インストーラを作る
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # タグのときだけ Release を作る
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DCS 会計 {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: インストーラを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
