# Windows と macOS 用のインストーラを、それぞれの OS の上で作る。
#
# - 手動で実行（Actions タブの「Run workflow」）: インストーラを成果物（Artifacts）として保存する
# - v から始まるタグ（例: v0.2.0）をプッシュ: GitHub の Release を下書きで作り、
#   インストーラと自動アップデート用のファイル（latest.json と署名）を添付する
#
# 自動アップデートには、リポジトリの Secrets に TAURI_SIGNING_PRIVATE_KEY が必要。
# ないときも手動実行のビルドはできるが、アップデート用のファイルは作られない。
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-ci:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: タグと同じコミットの main CI が成功するまで待つ
        shell: bash
        run: |
          set -euo pipefail
          # タグと main が同時に push され、CI の登録が少し遅れる場合も待つ。
          for ((attempt=1; attempt<=30; attempt++)); do
            run_id=$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -F per_page=1 \
              --jq '.workflow_runs[0].id // empty')
            [[ -z "$run_id" ]] || break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::このタグのコミットに対応する main の CI が見つかりません"
            exit 1
          fi
          echo "CI: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id"
          while true; do
            result=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion // "pending"')
            case "$result" in
              success) exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::main の CI の結果: $result"; exit 1 ;;
            esac
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: "--bundles nsis"
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: アップデート用の署名鍵があるかを確かめる
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::公開用のビルドには Secrets の TAURI_SIGNING_PRIVATE_KEY が必要です"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY がないため、アップデート用のファイルは作りません"
            echo "args=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 署名鍵の形式を確かめる
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-signing-key.mjs

      - name: ビルド前にテスト用ファイルへ署名する
        if: steps.signing.outputs.args == ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/signing-preflight.mjs

      - name: この版の変更点を CHANGELOG.md から取り出す
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          # macOS は Apple Silicon 用だけを作る
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: インストーラを作る
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHOBIYORI_GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.CHOBIYORI_GOOGLE_CALENDAR_CLIENT_ID }}
          CHOBIYORI_GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.CHOBIYORI_GOOGLE_CALENDAR_CLIENT_SECRET }}
          CHOBIYORI_OUTLOOK_CALENDAR_CLIENT_ID: ${{ vars.CHOBIYORI_OUTLOOK_CALENDAR_CLIENT_ID }}
        with:
          # -- 以降は cargo に渡す。Cargo.lock と違う版の crate を使わない
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }} -- --locked
          # タグのときだけ Release を作る。自動アップデートは公開した Release の latest.json を見る
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('帳日和 {0}', github.ref_name) || '' }}
          # CHANGELOG.md の変更点。自動アップデートの案内にもこの文が表示される
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Mac 配布物のアプリ署名を検証する
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle
        env:
          BUILD_UPDATER: ${{ steps.signing.outputs.args == '' }}
        run: |
          verification_dir="$(mktemp -d)"
          mount_point="$verification_dir/dmg"
          mkdir "$mount_point"
          trap 'rm -rf "$verification_dir"' EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" dmg/Chobiyori_*.dmg
          trap 'hdiutil detach "$mount_point" && rm -rf "$verification_dir"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/Chobiyori.app"

          if [ "$BUILD_UPDATER" = "true" ]; then
            tar -xzf macos/Chobiyori.app.tar.gz -C "$verification_dir"
            codesign --verify --deep --strict --verbose=2 "$verification_dir/Chobiyori.app"
          fi

      - name: インストーラを成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg

  publish:
    needs: [release-ci, build]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      built_tag: ${{ github.ref_name }}
