# Windows と macOS 用のインストーラを、それぞれの OS の上で作る。
#
# - 手動で実行（Actions タブの「Run workflow」）: インストーラを成果物（Artifacts）として保存する
# - v から始まるタグ（例: v0.2.0）をプッシュ: GitHub の Release を下書きで作り、
#   インストーラと自動アップデート用のファイル（latest.json と署名）を添付する
#
# 自動アップデートには、リポジトリの Secrets に TAURI_SIGNING_PRIVATE_KEY が必要。
# ないときも手動実行のビルドはできるが、アップデート用のファイルは作られない。
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: "--bundles nsis"
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: アップデート用の署名鍵があるかを確かめる
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::公開用のビルドには Secrets の TAURI_SIGNING_PRIVATE_KEY が必要です"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY がないため、アップデート用のファイルは作りません"
            echo "args=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: この版の変更点を CHANGELOG.md から取り出す
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # macOS は Apple Silicon 用だけを作る
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: インストーラを作る
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # -- 以降は cargo に渡す。Cargo.lock と違う版の crate を使わない
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }} -- --locked
          # タグのときだけ Release を作る。自動アップデートは公開した Release の latest.json を見る
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DCS 会計 {0}', github.ref_name) || '' }}
          # CHANGELOG.md の変更点。自動アップデートの案内にもこの文が表示される
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: インストーラを成果物として保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
